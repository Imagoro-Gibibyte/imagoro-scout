[package]
name = "scout-sec-gate"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Scout Security Suite - serving gate (key auth, model allowlist, content rules, streaming proxy)"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
hyper = { version = "1.4", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1.7"
sha2 = "0.10"
hex = "0.4"
subtle = "2.5"
# Signed envelopes (auth::verify_envelope), kept for the rack phase; not wired yet.
ed25519-dalek = "2.1"

[dev-dependencies]
http-body = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
