[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-security-core"
version = "0.4.0"
description = "Scout Security Suite core: role-scoped blackboard, injection screening, redaction, countermeasure guard and executor"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "cryptography>=42",  # Ed25519 operator signatures on the control API
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
