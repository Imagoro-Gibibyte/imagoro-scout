name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  leakcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/leakcheck.py
      - run: python -m unittest discover -s tools
  python:
    needs: leakcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s models
      - run: cd packages/keygate && python -m unittest test_keygate
      - run: cd packages/hazard-sources && python -m unittest discover -s tests
      - run: cd packages/security-core && pip install -e ".[dev]" && pytest -q
  rust:
    needs: leakcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cd packages/gate && cargo test && cargo clippy --all-targets
  ui:
    needs: leakcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd packages/ui-core && npm ci && npx vitest run && npx tsc -p tsconfig.json --noEmit
